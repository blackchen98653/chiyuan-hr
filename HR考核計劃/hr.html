<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HR 總覽 · CHIYUAN TEA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF8F2;--card:#FFFFFF;--ink:#2A2320;--muted:#8A7E6F;
    --tea:#34503F;--tea-deep:#263B2E;--tea-soft:#E9EFE9;
    --sugar:#BE7E33;--sugar-soft:#F6ECDC;--pearl:#39291E;
    --line:#EBE3D6;--ok:#4C8A5C;--warn:#C4611F;--bad:#B4472E;--red:#C0392B;--red-soft:#FBE3DF;
    --shadow:0 6px 24px rgba(48,38,26,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px 64px}

  .top{padding:28px 4px 10px}
  .eyebrow{font-size:11px;letter-spacing:.28em;color:var(--sugar);text-transform:uppercase;font-weight:800}
  h1.big{font-size:26px;font-weight:900;margin:4px 0 6px;line-height:1.3}
  h1.big .hl{color:var(--tea)}
  .lead{margin:0 0 18px;color:var(--muted);font-size:14px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
  @media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 14px;box-shadow:var(--shadow)}
  .stat .num{font-size:26px;font-weight:900;color:var(--tea-deep);line-height:1}
  .stat .lb{font-size:12px;color:var(--muted);font-weight:700;margin-top:6px}
  .stat.due .num{color:var(--red)}
  .stat.done .num{color:var(--ok)}

  .storebtns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .storebtns button{font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:9px 15px;transition:all .12s}
  .storebtns button:hover{border-color:#DCD3C3}
  .storebtns button.on{background:var(--tea);border-color:var(--tea);color:#fff}
  .ctrl{margin-bottom:14px;display:flex;gap:8px}
  .ctrl input{flex:1;min-width:0;font-family:inherit;font-size:15px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px}
  .ctrl input:focus{outline:none;border-color:var(--tea);box-shadow:0 0 0 4px var(--tea-soft)}
  .syncbtn{flex:none;font-family:inherit;font-size:13.5px;font-weight:800;color:var(--tea,#34503F);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;white-space:nowrap}
  .syncbtn:active{transform:translateY(1px)}
  .syncbtn.spin{opacity:.6;pointer-events:none}

  .store-head{display:flex;align-items:center;gap:10px;margin:22px 2px 10px}
  .store-head .nm{font-size:17px;font-weight:900;color:var(--tea-deep)}
  .store-head .ct{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}

  .row{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 15px;margin-bottom:10px}
  .rtop{display:flex;align-items:center;gap:12px}
  .av{flex:none;width:38px;height:38px;border-radius:11px;background:var(--tea-soft);display:grid;place-items:center;font-weight:800;color:var(--tea);font-size:15px}
  .who{flex:1;min-width:0}
  .who .n{display:block;font-weight:800;font-size:15.5px}
  .rolepill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 7px;margin-left:7px;vertical-align:1px}
  .rp-sm{background:#FBE3DF;color:var(--red)} .rp-rsv{background:#F3E9DB;color:#8B5A2B}
  .rp-ft{background:#E4ECF7;color:#2E6FD8} .rp-pt{background:#E7F1EA;color:var(--ok)}
  .who .jd{font-size:12px;color:var(--muted);margin-top:2px;display:block}
  .who .jd .pin{color:var(--tea)}
  .kpi{flex:none;text-align:right}
  .kpi .pc{font-size:17px;font-weight:900;line-height:1}
  .kpi .sub{font-size:11px;color:var(--muted);margin-top:2px}

  /* 技能：五大類覆蓋 + 可展開明細 */
  .sk-none{font-size:11.5px;color:var(--muted);margin-top:11px;font-style:normal}
  .gcov{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:11px;cursor:pointer}
  .gc{flex:1;min-width:60px;text-align:center;border-radius:9px;padding:6px 4px;border:1.5px solid var(--line);background:#fff}
  .gc .gn{font-size:10.5px;font-weight:800;letter-spacing:.02em}
  .gc .gd{font-size:13px;font-weight:900;margin-top:1px}
  .gcov-hint{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
  .skdetail{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .skdetail.open{display:block}
  .skg{font-size:11px;font-weight:900;letter-spacing:.1em;margin:9px 0 5px}
  .skg:first-child{margin-top:0}
  .skl{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));column-gap:18px;row-gap:13px}
  .skm{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
  .skm-n{color:var(--ink);line-height:1.3}
  .skm-bar{display:inline-flex;gap:2px}
  .skm-bar i{width:6px;height:12px;border-radius:1px;background:#E7E1D5}
  /* 偏好班別（放名字旁） */
  .prefshift{margin-left:8px;display:inline-flex;align-items:center;gap:4px;vertical-align:1px}
  .pslab{font-size:10.5px;color:var(--muted);font-weight:700}
  .sh.sm{font-size:11px;padding:2px 8px;font-weight:700}

  /* 班別 */
  .shifts{display:flex;align-items:center;gap:7px;margin-top:11px;flex-wrap:wrap}
  .shifts .slab{font-size:11.5px;color:var(--muted);font-weight:700}
  .sh{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;border-radius:999px;padding:4px 11px;border:1.5px solid var(--line);color:var(--muted);background:#fff}
  .sh.on.mor{background:#FFF6E3;border-color:#EAD3A0;color:#A9701F}
  .sh.on.mid{background:#E7EEFA;border-color:#BFD0EE;color:#2E6FD8}
  .sh.on.nig{background:#EEE9F7;border-color:#D2C6EC;color:#6E4FB0}

  /* checklist chips + 新考 */
  .chkrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
  .ci{position:relative;min-width:50px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;font-weight:800;color:#9A8F80;background:#F7F3EC;border:1px solid #EFE8DC;border-radius:8px;padding:5px 6px}
  .ci svg{width:11px;height:11px;flex:none}
  .ci .sq{fill:none;stroke:currentColor;stroke-width:2.6}
  /* 尚未繳交／登記 → 紅色醒目 */
  .ci.no{color:#fff;background:#D9483A;border:1.5px solid #C0392B}
  .ci.no .sq{stroke:#fff}
  .ci.na{color:#8C8477;background:#F0EDE6;border-color:#E4DED2}
  .ci.na .xm{stroke:currentColor;stroke-width:3.2;fill:none;stroke-linecap:round}
  /* 待核對（與 HR 紀錄不符）→ 強化橘色 */
  .ci.self{color:#fff;background:#F0902A;border:1.5px solid #D9760E;box-shadow:0 0 0 2px rgba(240,144,42,.30)}
  .ci.self .dt2{fill:#fff;stroke:none}
  .ci.on{color:#3E7A54;background:#E8F2EA;border-color:#CFE2D3}
  .ci.on svg{stroke:currentColor;stroke-width:3.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  /* 桌機滑鼠 hover 提示；手機改用點選彈窗（.citip） */
  .ci{cursor:pointer}
  @media (hover:hover){
    .ci[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#2A2320;color:#fff;font-size:11px;font-weight:600;white-space:nowrap;padding:5px 9px;border-radius:7px;z-index:30;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.18)}
    .ci[data-tip]:hover::before{content:'';position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#2A2320;z-index:30;pointer-events:none}
  }
  .ci:active{filter:brightness(.94)}
  .citip{position:fixed;z-index:200;background:#2A2320;color:#fff;font-size:12.5px;font-weight:600;line-height:1.5;padding:9px 13px;border-radius:10px;max-width:min(230px,86vw);box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transform:translateY(4px);transition:opacity .14s,transform .14s;pointer-events:none}
  .citip.show{opacity:1;transform:translateY(0)}
  .citip::after{content:'';position:absolute;top:100%;left:var(--ax,50%);transform:translateX(-50%);border:6px solid transparent;border-top-color:#2A2320}
  .ci.nk{border-style:solid}
  .ci.nk.pass{color:#fff;background:var(--tea);border-color:var(--tea)}
  .ci.nk.wait{color:var(--red);background:var(--red-soft);border-color:#F0C9C2}

  .backbtn{display:inline-block;margin-bottom:12px;font-size:13px;font-weight:800;color:var(--tea,#34503F);background:#fff;border:1.5px solid #E4DED2;border-radius:999px;padding:7px 15px;text-decoration:none}
  .backbtn:active{transform:translateY(1px)}
  /* 建議調整薪資提醒 */
  #raiseBanner{display:none}
  .raise-banner{display:flex;align-items:center;gap:10px;background:#EAF5EE;border:1.5px solid #B9DCC5;border-radius:14px;padding:12px 14px;margin:2px 0 14px}
  .raise-banner.active{background:#E1F0E7;border-color:#8FCBA5}
  .raise-banner .rb-ic{font-size:20px;flex:none}
  .raise-banner .rb-txt{flex:1;font-size:13.5px;color:#2C5A3E;font-weight:700;line-height:1.4}
  .raise-banner .rb-txt b{color:#256B41;font-size:15px}
  .raise-banner .rb-btn{flex:none;font-family:inherit;font-size:12.5px;font-weight:800;color:#fff;background:#3E7A54;border:none;border-radius:999px;padding:8px 14px;cursor:pointer}
  .raise-banner .rb-btn:active{transform:translateY(1px)}
  .raisebadge{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:#3E7A54;border-radius:6px;padding:2px 8px;margin-left:6px;white-space:nowrap;box-shadow:0 1px 4px rgba(62,122,84,.3)}
  .who .sal{display:block;font-size:11.5px;font-weight:800;color:#8A6D3B;margin-top:3px;line-height:1.4}
  .row.needraise{box-shadow:inset 4px 0 0 #3E7A54, var(--shadow,0 1px 3px rgba(0,0,0,.06))}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
  .legend{font-size:11.5px;color:var(--muted);margin:6px 2px 14px;line-height:1.9}
  .legend .k{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin:0 3px 0 8px}
  .lgd{display:inline-flex;align-items:center;gap:4px;margin:0 12px 4px 0}
  .lgd .skm-bar i{height:10px}
  .foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:30px;letter-spacing:.03em}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="eyebrow">HR - CHIYUAN</span>
    <h1 class="big">人力<span class="hl">總覽</span></h1>
    <p class="lead">各門市每位夥伴的技能覆蓋、偏好班別；新人另顯示報到進度與新人考核狀態。</p>
  </div>

  <div class="stats" id="stats"></div>

  <div id="raiseBanner"></div>

  <div class="storebtns" id="fStore"></div>
  <div class="ctrl"><input id="fName" type="text" placeholder="搜尋姓名…"><button id="btnSync" class="syncbtn" title="同步最新評核">🔄 同步</button></div>

  <div class="legend" id="legend"></div>
  <div id="body"></div>
  <p class="foot">技能與班別來自「技能評核」；報到與新考來自雲端名冊。<br>HR - CHIYUAN</p>
</div>

<script src="assets/config.js"></script>
<script>
const H = window.CHIYUAN;
const SK = H.SKILLS;
const $=id=>document.getElementById(id);
const ABBR=H.CHECKLIST.ABBR, FULL=H.CHECKLIST.FULL;
const LV=SK.LEVELS, ORDER=SK.LEVEL_ORDER, KEYS=SK.ALL_KEYS;

function fmt(d){return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;}
function daysSince(d){return Math.floor((Date.now()-d.getTime())/86400000);}
function shortRole(r){ r=r||''; if(/^店經理$/.test(r))return['店經理','rp-sm']; if(/儲備/.test(r))return['儲備','rp-rsv']; if(/正職/.test(r))return['正職','rp-ft']; return['兼職','rp-pt']; }
function covColor(pct){ if(pct>=80)return'#16A76A'; if(pct>=50)return'#2E6FD8'; if(pct>=25)return'#C88B00'; return'#C0392B'; }
// 名冊有「留停松江」「病假板橋」等前綴 → 正規化回原門市 + 狀態標記，HR 才不漏看
function storeInfo(raw){
  for(const p of ['留停','病假','育嬰','留職停薪']){
    if(raw.startsWith(p)){ const rest=raw.slice(p.length);
      const full=SK.EVALUABLE_STORES.find(s=>s.startsWith(rest)||s.indexOf(rest)>=0);
      return {store:full||raw, tag:p}; }
  }
  return {store:raw, tag:''};
}

let PEOPLE=[], STAFF=[], curStore='', onlyRaise=false;
async function init(){
  await H.DataAPI.syncSkillsToLocal();   // 雲端模式：先把技能/班別抓進本機再顯示
  await H.DataAPI.fetchSalary();          // 薪資（判斷建議加薪）
  PEOPLE = await H.DataAPI.getAll();
  PEOPLE.forEach(p=>{ const e=H.DataAPI.loadEval(p); if(e){ p.eval=e; p.drinkOn=!!e.drinkOn; } });
  // 員工清單＝大表在職名單（加人/刪人即時反映）；只取 12 門市
  STAFF = PEOPLE.filter(p=>(p.name||'').trim())
    // 技能鍵：工號優先、空工號(板橋等)退回姓名，與技能評核頁一致，才對得上技能資料
    .map(p=>{ const si=storeInfo(p.store); return Object.assign({}, p, {id:(p.id||p.name), store:si.store, leave:si.tag}); })
    .filter(p=> SK.EVALUABLE_STORES.indexOf(p.store)>=0 );

  const wrap=$('fStore');
  // 店經理入口：?store=X → 鎖定單店「夥伴總覽」（同 HR 格式，只看本店）
  const lockStore=new URLSearchParams(location.search).get('store')||'';
  if(lockStore && SK.EVALUABLE_STORES.indexOf(lockStore)>=0){
    curStore=lockStore;
    wrap.style.display='none';                                   // 隱藏門市切換
    document.querySelector('.eyebrow').textContent='店經理 · 夥伴總覽';
    document.querySelector('.big').innerHTML='夥伴<span class="hl">總覽</span>';
    document.querySelector('.lead').textContent='📍 '+curStore+'　本店所有夥伴的技能覆蓋、偏好班別、報到與新人考核狀態。';
    const back=document.createElement('a');
    back.href='manager.html?store='+encodeURIComponent(curStore)+'&to=menu';
    back.className='backbtn'; back.textContent='‹ 回上一頁';
    document.querySelector('.top').prepend(back);
  } else {
    const mk=(v,l)=>{ const b=document.createElement('button'); b.dataset.v=v; b.textContent=l; if(v===curStore)b.classList.add('on'); wrap.appendChild(b); };
    mk('','全部門市');
    SK.EVALUABLE_STORES.forEach(s=>mk(s,s));
    wrap.addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b) return;
      curStore=b.dataset.v;
      [...wrap.children].forEach(x=>x.classList.toggle('on', x.dataset.v===curStore));
      render();
    });
  }
  $('fName').addEventListener('input',render);

  $('legend').innerHTML = '技能等級（格數＝等級）：'+ORDER.map((k,idx)=>{
    let bars=''; for(let n=0;n<5;n++) bars+=`<i${n<=idx?` style="background:${LV[k].color}"`:''}></i>`;
    return `<span class="lgd"><span class="skm-bar">${bars}</span>${LV[k].label}</span>`;
  }).join('');
  render();
}

// 仍在報到/試用期（新人護照考核未通過）→ 顯示 checklist / 新考
function isNewbie(p){ return !p.passed; }
function isPassed(nb){ if(!nb) return null; if(nb.passed) return true; const e=nb.eval; if(e){ return H.score(e.levels,nb.job,nb.drinkOn===true)>=H.PASS; } return false; }

function groupCov(ev, gk){
  const g=SK.GROUPS[gk]; let done=0, score=0;
  g.skills.forEach(sk=>{ const v=ev[sk]; if(v&&LV[v]){ done++; score+=LV[v].weight; } });
  return { short:g.short, label:g.label, color:g.color, done, total:g.skills.length, pct:Math.round(score/g.skills.length*100) };
}
function skillBlockHTML(empId){
  const cov=H.DataAPI.skillCoverage(empId);
  if(cov.done===0) return {html:`<div class="sk-none">技能尚未評核</div>`, cov};
  const ev=cov.evals, gkeys=Object.keys(SK.GROUPS);
  // 收合：五大類覆蓋（顏色＝該類熟練度）
  const chips=gkeys.map(gk=>{ const c=groupCov(ev,gk); const col=c.done?covColor(c.pct):'#C3BFB6';
    return `<div class="gc" style="border-color:${col}55"><div class="gn" style="color:${col}">${c.short}</div><div class="gd" style="color:${col}">${c.done}/${c.total}</div></div>`;
  }).join('');
  // 展開：完整技能清單（依分類，名稱＋等級）
  let detail='';
  gkeys.forEach(gk=>{ const g=SK.GROUPS[gk];
    const items=g.skills.filter(sk=>ev[sk]&&LV[ev[sk]]).map(sk=>{ const lv=ev[sk];
      const idx=ORDER.indexOf(lv), col=LV[lv].color;
      let bars=''; for(let n=0;n<5;n++) bars+=`<i${n<=idx?` style="background:${col}"`:''}></i>`;
      return `<span class="skm" title="${SK.LABELS[sk]}：${LV[lv].label}"><span class="skm-n">${SK.LABELS[sk]}</span><span class="skm-bar">${bars}</span></span>`;
    }).join('');
    if(items) detail+=`<div class="skg" style="color:${g.color}">${g.label}</div><div class="skl">${items}</div>`;
  });
  const last=H.DataAPI.lastSkillEval(empId);
  const lastTxt=last?`最後評核 ${last.getMonth()+1}/${last.getDate()}`:'';
  return { html:`<div class="gcov"><div style="display:flex;gap:6px;flex:1;flex-wrap:wrap">${chips}</div><span class="gcov-hint">${lastTxt?lastTxt+'　':''}▸ 明細</span></div><div class="skdetail">${detail}</div>`, cov };
}
// 偏好班別（放名字旁，只顯示有設定的）
function prefShiftHTML(empId){
  const sh=H.DataAPI.shiftOf(empId);
  const conf=[['morning','☀️早','mor'],['mid','⛅中','mid'],['night','🌙晚','nig']];
  const on=conf.filter(c=>sh[c[0]]);
  if(!on.length) return '';
  return `<span class="prefshift"><span class="pslab">偏好班別</span>`+
    on.map(c=>`<span class="sh sm ${c[2]} on">${c[1]}</span>`).join('')+`</span>`;
}
function chipsHTML(nb){
  const live=H.DataAPI.liveTicks(nb);
  let chips=live.map((v,i)=>
    `<span class="ci ${v==='na'?'na':v==='self'?'self':(v?'on':'no')}" data-tip="${FULL[i]}${v===true?'（HR 已登記）':v==='na'?'（免投保）':v==='self'?'（新人已回報，待 HR 核對）':'（尚未繳交／登記）'}"><span class="lb">${ABBR[i]}</span>`+
    (v==='na'?`<svg viewBox="0 0 24 24"><path class="xm" d="M6 6l12 12M18 6L6 18"/></svg>`
     : v==='self'?`<svg viewBox="0 0 24 24"><circle class="dt2" cx="12" cy="12" r="5"/></svg>`
     : v===true?`<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>`
       :`<svg viewBox="0 0 24 24"><rect class="sq" x="4.5" y="4.5" width="15" height="15" rx="3"/></svg>`)+
    `</span>`).join('');
  // GHP 宣導影片（店經理確認）
  const gon=H.DataAPI.ghpOf(nb);
  chips += `<span class="ci ${gon?'on':'no'}" data-tip="GHP 宣導影片${gon?'（店經理已確認）':'（尚未確認）'}"><span class="lb">GHP</span>`+
    (gon?`<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>`
        :`<svg viewBox="0 0 24 24"><rect class="sq" x="4.5" y="4.5" width="15" height="15" rx="3"/></svg>`)+`</span>`;
  // 後方新增「新考」= 新人考核是否通過
  const pass=isPassed(nb);
  chips += `<span class="ci nk ${pass?'pass':'wait'}" data-tip="新人考核${pass?'已通過':'尚未通過'}"><span class="lb">新考</span>`+
    (pass?`<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>`
        :`<svg viewBox="0 0 24 24"><rect class="sq" x="4.5" y="4.5" width="15" height="15" rx="3"/></svg>`)+`</span>`;
  return `<div class="chkrow">${chips}</div>`;
}

function toggleOnlyRaise(){ onlyRaise=!onlyRaise; render(); }
const nf = n => (n==null?'—':Number(n).toLocaleString('en-US'));
// 目前薪資：正職 本薪・伙食・職獎；兼職 時薪
function salLineHTML(emp){
  const s=H.DataAPI.salaryOf(emp); if(!s) return '';
  const hourly = s.type==='時薪制' || (s.hourly!=null && s.base==null);
  let info='';
  if(hourly){ if(s.hourly==null) return ''; info=`時薪 ${nf(s.hourly)}`; }
  else { if(s.base==null) return ''; info=`本薪 ${nf(s.base)}・伙食 ${nf(s.food||0)}・職獎 ${nf(s.bonus||0)}`; }
  return `<span class="sal">💰 ${info}</span>`;
}
function rowHTML(emp){
  const [rl,rc]=shortRole(emp.role);
  const {html:skblock,cov}=skillBlockHTML(emp.id);
  const nb=isNewbie(emp)?emp:null;
  const av=emp.name?emp.name[emp.name.length-1]:'?';
  const raise=H.DataAPI.raiseFor(emp);
  return `<div class="row${raise?' needraise':''}">
    <div class="rtop">
      <span class="av">${av}</span>
      <span class="who">
        <span class="n">${emp.name}<span class="rolepill ${rc}">${rl}</span>${emp.leave?`<span class="rolepill" style="background:#F0EDE6;color:#8C8477">${emp.leave}</span>`:''}${raise?`<span class="raisebadge">💰 建議加薪 ${raise}</span>`:''}${prefShiftHTML(emp.id)}</span>
        <span class="jd"><span class="pin">📍 ${emp.store}</span>${nb?(emp.joinKnown?'　到職 '+fmt(nb.join):'　⚠️ 尚未報到'):''}</span>
        ${salLineHTML(emp)}
      </span>
      <span class="kpi"><div class="pc" style="color:${cov.done?covColor(cov.pct):'#C3BFB6'}">${cov.done?cov.pct+'%':'—'}</div><div class="sub">技能 ${cov.done}/${cov.total}</div></span>
    </div>
    ${skblock}
    ${nb?chipsHTML(nb):''}
  </div>`;
}

function render(){
  const fn=$('fName').value.trim();
  let list=STAFF.slice();
  if(curStore) list=list.filter(e=>e.store===curStore);
  if(fn) list=list.filter(e=>e.name.includes(fn));

  // 建議調整薪資提醒（依目前門市範圍計數）
  const raiseScope=(curStore?STAFF.filter(e=>e.store===curStore):STAFF).filter(e=>H.DataAPI.raiseFor(e));
  const rb=$('raiseBanner');
  if(raiseScope.length){
    rb.style.display='block';
    rb.className='raise-banner'+(onlyRaise?' active':'');
    rb.innerHTML=`<span class="rb-ic">💰</span><span class="rb-txt"><b>${raiseScope.length} 位</b>夥伴通過考核，建議調整薪資</span>`+
      `<button class="rb-btn" onclick="toggleOnlyRaise()">${onlyRaise?'顯示全部':'只看這些'}</button>`;
  } else { rb.style.display='none'; onlyRaise=false; }
  if(onlyRaise) list=list.filter(e=>H.DataAPI.raiseFor(e));

  // 統計（依目前門市篩選，不受姓名搜尋影響）
  let base=STAFF.slice(); if(curStore) base=base.filter(e=>e.store===curStore);
  const evaled=base.filter(e=>H.DataAPI.skillCoverage(e.id).done>0).length;
  const avg=base.length?Math.round(base.reduce((s,e)=>s+H.DataAPI.skillCoverage(e.id).pct,0)/base.length):0;
  const newbies=base.filter(isNewbie).length;
  const stores=curStore?1:new Set(base.map(e=>e.store)).size;
  $('stats').innerHTML=`
    <div class="stat"><div class="num">${base.length}</div><div class="lb">在職夥伴</div></div>
    <div class="stat done"><div class="num">${evaled}</div><div class="lb">已評核技能</div></div>
    <div class="stat"><div class="num">${avg}%</div><div class="lb">平均技能覆蓋</div></div>
    <div class="stat"><div class="num">${curStore?newbies:stores}</div><div class="lb">${curStore?'新人數':'涵蓋門市'}</div></div>`;

  if(!list.length){ $('body').innerHTML='<div class="empty">沒有符合條件的夥伴。</div>'; return; }

  const rolePri=e=>{const r=e.role||'';return /^店經理$/.test(r)?0:/儲備/.test(r)?1:/正職/.test(r)?2:3;};
  const sortFn=(a,b)=>{const d=rolePri(a)-rolePri(b);return d||(a.id||'').localeCompare(b.id||'');};

  let html='';
  if(curStore){
    list.sort(sortFn);
    html=list.map(rowHTML).join('');
  }else{
    // 全部門市：依門市分組
    SK.EVALUABLE_STORES.forEach(store=>{
      const grp=list.filter(e=>e.store===store).sort(sortFn);
      if(!grp.length) return;
      const gn=grp.filter(isNewbie).length;
      html+=`<div class="store-head"><span class="nm">📍 ${store}</span><span class="ct">${grp.length} 人${gn?'・新人 '+gn:''}</span></div>`;
      html+=grp.map(rowHTML).join('');
    });
  }
  $('body').innerHTML=html;

  // 點五大類覆蓋 → 展開/收合技能明細
  document.querySelectorAll('#body .gcov').forEach(el=>{
    const d=el.parentNode.querySelector('.skdetail'); if(!d) return;
    el.addEventListener('click',()=>{
      const open=d.classList.toggle('open');
      const hint=el.querySelector('.gcov-hint'); if(hint) hint.textContent = open?'▾ 收合':'▸ 明細';
    });
  });
}

init();

/* ===== chip 點選顯示說明彈窗（手機友善） ===== */
const _citip=document.createElement('div'); _citip.className='citip'; document.body.appendChild(_citip);
let _citipT;
function showCitip(el){
  const txt=el.getAttribute('data-tip'); if(!txt) return;
  _citip.textContent=txt; _citip.classList.add('show');
  _citip.style.left='0px'; _citip.style.top='-9999px';
  const r=el.getBoundingClientRect(), tw=_citip.offsetWidth, th=_citip.offsetHeight, m=8;
  let left=Math.max(m, Math.min(r.left+r.width/2-tw/2, innerWidth-tw-m));
  let top=r.top-th-10; if(top<m) top=r.bottom+10;
  _citip.style.left=left+'px'; _citip.style.top=top+'px';
  _citip.style.setProperty('--ax',(r.left+r.width/2-left)+'px');
  clearTimeout(_citipT); _citipT=setTimeout(hideCitip,3500);
}
function hideCitip(){ _citip.classList.remove('show'); }
document.addEventListener('click',e=>{
  const chip=e.target.closest && e.target.closest('.ci[data-tip]');
  if(chip){ e.stopPropagation(); showCitip(chip); }
  else if(!(e.target.closest && e.target.closest('.citip'))) hideCitip();
});
window.addEventListener('scroll',hideCitip,true);

/* ===== 自動同步：切回本頁 / 手動按鈕，重抓雲端最新評核並重繪 ===== */
let _syncing=false;
async function autoSync(manual){
  if(_syncing) return;
  if(!manual && document.visibilityState!=='visible') return;
  _syncing=true;
  const b=$('btnSync'); if(b){ b.classList.add('spin'); b.textContent='⏳ 同步中'; }
  try{ await H.DataAPI.syncSkillsToLocal(); render(); }catch(e){}
  if(b){ b.classList.remove('spin'); b.textContent='🔄 同步'; }
  _syncing=false;
}
(function bindSync(){
  const b=$('btnSync'); if(b) b.addEventListener('click',()=>autoSync(true));
  // 切回本分頁 / 視窗重新取得焦點 → 自動抓最新（不打斷正在閱讀，只在回到頁面時）
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') autoSync(false); });
  window.addEventListener('focus',()=>autoSync(false));
})();
</script>
